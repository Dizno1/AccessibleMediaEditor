name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Download and verify FFmpeg sidecar
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "AccessibleProductionStudio-Build"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" -Headers $headers
          # The upstream release uses changing build identifiers in archive names.
          # Select exactly one Windows x64 LGPL ZIP, excluding shared variants.
          $matches = @($release.assets | Where-Object {
            $_.name -match '^ffmpeg-(?:master-latest|N-[A-Za-z0-9-]+)-win64-lgpl\.zip$'
          })
          if ($matches.Count -ne 1) { throw "Expected exactly one Windows x64 LGPL FFmpeg ZIP, found $($matches.Count)." }
          $asset = $matches[0]
          $checksums = $release.assets | Where-Object { $_.name -eq "checksums.sha256" } | Select-Object -First 1
          if (-not $asset -or -not $checksums) { throw "The verified FFmpeg release assets were not found." }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ffmpeg.zip
          Invoke-WebRequest -Uri $checksums.browser_download_url -OutFile checksums.sha256
          # Match the exact selected archive name, not a historical hardcoded name.
          $expectedLine = Get-Content checksums.sha256 | Where-Object {
            $parts = $_.Trim() -split '\s+', 2
            $parts.Count -eq 2 -and $parts[1].TrimStart('*') -eq $asset.name
          } | Select-Object -First 1
          if (-not $expectedLine) { throw "The FFmpeg checksum was not found." }
          $expected = ($expectedLine -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg checksum verification failed." }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-package
          $ffmpeg = Get-ChildItem ffmpeg-package -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe was not found in the verified archive." }
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $ffmpeg.FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          & src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -version
      - name: Run tests
        run: npm test
      - name: Build installers for manual testing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run desktop:build
      - name: Build installers and create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Accessible Production Studio ${{ github.ref_name }}"
          releaseBody: "Screen-reader-first Windows multimedia authoring from Open Door Design."
          releaseDraft: true
          prerelease: true
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleProductionStudioWindowsInstallers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
