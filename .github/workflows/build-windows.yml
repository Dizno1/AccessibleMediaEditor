name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build installers for manual testing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run desktop:build
      - name: Build installers and create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Accessible Media Editor ${{ github.ref_name }}"
          releaseBody: "Screen-reader-first Windows multimedia authoring from Open Door Design."
          releaseDraft: true
          prerelease: true
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleMediaEditorWindowsInstallers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
