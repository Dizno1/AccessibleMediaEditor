name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Download and verify FFmpeg sidecar
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "AccessibleMediaEditor-Build"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq "ffmpeg-master-latest-win64-lgpl.zip" } | Select-Object -First 1
          $checksums = $release.assets | Where-Object { $_.name -eq "checksums.sha256" } | Select-Object -First 1
          if (-not $asset -or -not $checksums) { throw "The verified FFmpeg release assets were not found." }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ffmpeg.zip
          Invoke-WebRequest -Uri $checksums.browser_download_url -OutFile checksums.sha256
          $expectedLine = Get-Content checksums.sha256 | Where-Object { $_ -match "\sffmpeg-master-latest-win64-lgpl\.zip$" } | Select-Object -First 1
          if (-not $expectedLine) { throw "The FFmpeg checksum was not found." }
          $expected = ($expectedLine -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg checksum verification failed." }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-package
          $ffmpeg = Get-ChildItem ffmpeg-package -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe was not found in the verified archive." }
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $ffmpeg.FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          & src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -version
      - name: Run tests
        run: npm test
      - name: Verify pinned Tauri runtime
        shell: pwsh
        run: |
          $tauriVersion = cargo tree --manifest-path src-tauri/Cargo.toml -p tauri --depth 0
          Write-Host $tauriVersion
          if ($tauriVersion -notmatch "tauri v2\.11\.5") {
            throw "Unexpected Tauri runtime. Build requires tauri v2.11.5."
          }
          $shellVersion = cargo tree --manifest-path src-tauri/Cargo.toml -p tauri-plugin-shell --depth 0
          Write-Host $shellVersion
          if ($shellVersion -notmatch "tauri-plugin-shell v2\.3\.6") {
            throw "Unexpected shell plugin. Build requires tauri-plugin-shell v2.3.6."
          }
      - name: Build installers for manual testing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run desktop:build
      - name: Build installers and create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Accessible Media Editor ${{ github.ref_name }}"
          releaseBody: "Screen-reader-first Windows multimedia authoring from Open Door Design."
          releaseDraft: true
          prerelease: true
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleMediaEditorWindowsInstallers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
