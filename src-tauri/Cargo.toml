[package]
name = "accessible-production-studio"
version = "0.12.7"
description = "Screen-reader-first video, presentation, and audio production from Open Door Design."
authors = ["Open Door Design"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
dirs = "6"
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
  "Win32_System_Ole",
]

[target.'cfg(windows)'.dependencies.raw-window-handle]
version = "0.6"

[[bin]]
name = "accessible-production-studio"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
